<div id="wb-election-2026" class="election-card">
    <div class="header">
        <h2>WB Assembly Results 2026</h2>
        <span class="live-tag">LIVE COUNTING</span>
    </div>
    <div id="tally-container">
        <!-- Tally items will be injected here -->
        <p>Loading counting data...</p>
    </div>
    <div class="footer">
        <small id="last-updated">Updating...</small>
        <br>
        <small>Source: ECI Open Data (Mirror)</small>
    </div>
</div>

<style>
    .election-card {
        font-family: 'Inter', sans-serif;
        background: #fdfdfd;
        border: 1px solid #ddd;
        border-radius: 12px;
        width: 320px;
        padding: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .header h2 { margin: 0; font-size: 1.1rem; color: #333; }
    .live-tag {
        background: #ff0000;
        color: white;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
    }
    .tally-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px dashed #eee;
    }
    .party-name { font-weight: 600; width: 60px; }
    .bar-bg { background: #eee; flex-grow: 1; margin: 0 10px; height: 18px; border-radius: 9px; overflow: hidden; }
    .bar-fill { height: 100%; transition: width 0.5s ease; }
    .count { font-weight: 800; min-width: 30px; text-align: right; }
</style>

<script>
    const API_URL = "https://api.example.com/wb-election-2026"; // Real open-source mirror URL needed

    async function fetchResults() {
        try {
            // In a real app, replace this fetch with a real open-source data link
            // const response = await fetch(API_URL);
            // const data = await response.json();
            
            // Mock data representing the 1:00 PM trends on May 4, 2026
            const data = {
                updated: new Date().toLocaleTimeString(),
                results: [
                    { party: "AITC", count: 91, color: "#20C641" },
                    { party: "BJP", count: 185, color: "#FF9933" },
                    { party: "LEFT", count: 1, color: "#CC0000" },
                    { party: "OTH", count: 16, color: "#666666" }
                ]
            };

            renderTally(data);
        } catch (e) {
            console.error("Data fetch failed", e);
        }
    }

    function renderTally(data) {
        const container = document.getElementById('tally-container');
        container.innerHTML = '';
        
        data.results.forEach(p => {
            const percentage = (p.count / 294) * 100;
            container.innerHTML += `
                <div class="tally-row">
                    <span class="party-name">${p.party}</span>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: ${percentage}%; background: ${p.color};"></div>
                    </div>
                    <span class="count">${p.count}</span>
                </div>
            `;
        });
        document.getElementById('last-updated').innerText = "Last sync: " + data.updated;
    }

    setInterval(fetchResults, 30000); // Update every 30 seconds
    fetchResults();
</script>
